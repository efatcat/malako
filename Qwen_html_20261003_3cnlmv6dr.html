<style>
:root{
  --bg:#f4f4f5; --card:#fff; --text:#18181b; --sec:#71717a;
  --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --line:#e4e4e7;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.wrap{width:100%;max-width:640px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.08)}
.hdr{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fafafa}
.logo{font-weight:800;letter-spacing:1px;font-size:1.15rem}
.meta{font-size:.85rem;color:var(--sec);font-weight:600}
.bar{height:5px;background:var(--line)}
.fill{height:100%;width:0;background:var(--accent);transition:width .4s}
.body{padding:44px 30px;text-align:center;min-height:320px;display:flex;flex-direction:column;justify-content:center}
.qid{font-size:.75rem;color:var(--sec);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.qtxt{font-size:1.45rem;font-weight:600;line-height:1.4;margin-bottom:34px}
.opts{display:grid;gap:12px}
button.opt{background:#fff;border:1px solid var(--line);padding:15px;border-radius:10px;font-size:1rem;cursor:pointer;transition:.18s;font-weight:500}
button.opt:hover{border-color:var(--accent);background:#eff6ff}
button.opt:disabled{cursor:default}
button.opt.good{background:#dcfce7;border-color:var(--ok);color:#166534}
button.opt.bad{background:#fee2e2;border-color:var(--bad);color:#991b1b}
.flash-ok{animation:flashOk .55s}
.flash-bad{animation:flashBad .55s}
@keyframes flashOk{0%{background:#fff}40%{background:#dcfce7}100%{background:#fff}}
@keyframes flashBad{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.btn{background:var(--accent);color:#fff;border:none;padding:15px 44px;font-size:1.05rem;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{background:#1d4ed8}
.hidden{display:none}
</style>
</head>

// ================= ЛОГИКА =================
let idx = 0;
let order = [];
let currentCorrectText = "";

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start(){
  order = shuffle([...Array(Q.length).keys()]).slice(0, CONFIG.questionsCount);
  idx = 0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}

function render(){
  const q = Q[order[idx]];
  currentCorrectText = q[2][q[3]];

  document.getElementById('qid').textContent = 'ID: ' + String(q[0]).padStart(4,'0');
  document.getElementById('qtxt').textContent = q[1];
  document.getElementById('meta').textContent = 'Вопрос ' + (idx+1) + ' из ' + CONFIG.questionsCount;
  document.getElementById('fill').style.width = (idx/CONFIG.questionsCount*100)+'%';

  const box = document.getElementById('opts');
  box.innerHTML = '';
  // Перемешиваем варианты ответа, чтобы правильный не был всегда первым
  shuffle(q[2]).forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = ()=>answer(opt, b);
    box.appendChild(b);
  });
}

// Проверка ответа. «Очень правильно» засчитывается, если верен ответ «Правильно».
function isCorrect(selectedText, correctText){
  if(selectedText === correctText) return true;
  if(selectedText === 'Очень правильно' && correctText === 'Правильно') return true;
  return false;
}

function answer(selectedText, btn){
  const card = document.getElementById('card');
  const btns = document.querySelectorAll('#opts .opt');
  btns.forEach(b=>b.disabled = true);

  if(isCorrect(selectedText, currentCorrectText)){
    btn.classList.add('good');
    card.classList.add('flash-ok');
  } else {
    btn.classList.add('bad');
    btns.forEach(b=>{ if(b.textContent === currentCorrectText) b.classList.add('good'); });
    card.classList.add('flash-bad');
  }

  setTimeout(()=>{
    card.classList.remove('flash-ok','flash-bad');
    idx++;
    if(idx < CONFIG.questionsCount){ render(); } else { finish(); }
  }, 900);
}

function finish(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('done').classList.remove('hidden');
  document.getElementById('fill').style.width = '100%';
  document.getElementById('meta').textContent = 'Завершено';
  setTimeout(()=>{ window.location.href = CONFIG.redirectURL; }, 1800);
}
</script>
